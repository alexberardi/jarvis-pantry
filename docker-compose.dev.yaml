services:
  jarvis-pantry:
    build: .
    ports:
      - "${PANTRY_PORT:-7721}:${PANTRY_PORT:-7721}"
    volumes:
      - ./app:/app/app
      - ./.env:/app/.env
      - /var/run/docker.sock:/var/run/docker.sock
      - ../jarvis-command-sdk:/app/jarvis-command-sdk:ro
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
    extra_hosts:
      - "${DOCKER_HOST_ALIAS:-host.docker.internal}:host-gateway"
    command: >
      sh -c "cp -r /app/jarvis-command-sdk /tmp/sdk && pip install --no-cache-dir -q /tmp/sdk && rm -rf /tmp/sdk &&
             alembic upgrade head || true &&
             uvicorn app.main:app --host 0.0.0.0 --port ${PANTRY_PORT:-7721} --reload"

  postgres:
    profiles: ["standalone"]
    image: postgres:15
    environment:
      POSTGRES_DB: jarvis_pantry
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pantry-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pantry-pg-data:

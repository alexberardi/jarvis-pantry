services:
  jarvis-pantry:
    build: .
    ports:
      - "${PANTRY_PORT:-7721}:${PANTRY_PORT:-7721}"
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - ./app:/app/app
      - ./alembic:/app/alembic
      - ./.env:/app/.env
      - /var/run/docker.sock:/var/run/docker.sock
      - ../jarvis-command-sdk:/app/jarvis-command-sdk:ro
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/jarvis_pantry
    extra_hosts:
      - "${DOCKER_HOST_ALIAS:-host.docker.internal}:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      sh -c "cp -r /app/jarvis-command-sdk /tmp/sdk && pip install --no-cache-dir -q /tmp/sdk && rm -rf /tmp/sdk &&
             alembic upgrade head || true &&
             uvicorn app.main:app --host 0.0.0.0 --port ${PANTRY_PORT:-7721} --reload"

  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: jarvis_pantry
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - pantry-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pantry-pg-data:
